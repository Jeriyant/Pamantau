; Pamantau Portable PHP 8.4 configuration
; Paths are relative to the bundled php/ directory. PamantauServer.exe always
; starts PHP and PHP-CGI with php/ as their working directory.

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1

expose_php = Off
max_execution_time = 300
max_input_time = 120
max_input_vars = 5000
memory_limit = 256M

error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "${PAMANTAU_DATA_ROOT}/logs/php-error.log"
ignore_repeated_errors = Off
html_errors = Off
zend.exception_ignore_args = On

variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 64M
upload_max_filesize = 64M
file_uploads = On
upload_tmp_dir = "${PAMANTAU_DATA_ROOT}/temp"
max_file_uploads = 20

allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 30
default_charset = "UTF-8"
enable_dl = Off

sys_temp_dir = "${PAMANTAU_DATA_ROOT}/temp"
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Date]
date.timezone = "Asia/Jakarta"

[CGI]
cgi.force_redirect = 0
cgi.fix_pathinfo = 0
fastcgi.logging = 0

[Session]
session.save_handler = files
session.save_path = "${PAMANTAU_DATA_ROOT}/sessions"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 1440

[curl]
curl.cainfo = "${PAMANTAU_PORTABLE_ROOT}/php/extras/ssl/cacert.pem"

[openssl]
openssl.cafile = "${PAMANTAU_PORTABLE_ROOT}/php/extras/ssl/cacert.pem"

[Extensions]
extension_dir = "${PAMANTAU_PORTABLE_ROOT}/php/ext"
extension = curl
extension = fileinfo
extension = gd
extension = mbstring
extension = openssl
extension = sockets
extension = zip
